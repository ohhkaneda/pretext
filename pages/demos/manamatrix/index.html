<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>manamatrix.eth | Crypto Heatmap</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    
    :root {
      --bg-dark: #0d0d0d;
      --bg-panel: #1a1a1a;
      --border: #2a2a2a;
      --text-primary: #ffffff;
      --text-secondary: #888888;
      --text-muted: #555555;
      
      /* Heatmap colors - green to red */
      --gain-5: #00ff00;
      --gain-4: #33cc33;
      --gain-3: #339933;
      --gain-2: #336633;
      --gain-1: #334433;
      --neutral: #333333;
      --loss-1: #443333;
      --loss-2: #663333;
      --loss-3: #993333;
      --loss-4: #cc3333;
      --loss-5: #ff0000;
    }
    
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-dark);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-primary);
    }
    
    body {
      display: flex;
      flex-direction: column;
    }
    
    /* Header */
    .header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .logo-text {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #00ff88 0%, #00aaff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .header-stats {
      display: flex;
      gap: 24px;
    }
    
    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }
    
    .stat-value {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }
    
    .stat-value.positive { color: #00cc66; }
    .stat-value.negative { color: #ff4444; }
    
    .header-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    
    .chain-selector {
      display: flex;
      gap: 2px;
      background: var(--bg-dark);
      padding: 3px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    
    .chain-btn {
      padding: 5px 10px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.15s;
      text-transform: uppercase;
    }
    
    .chain-btn:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.05);
    }
    
    .chain-btn.active {
      background: #00ff88;
      color: #000000;
    }
    
    .search-box {
      position: relative;
    }
    
    .search-input {
      width: 180px;
      padding: 6px 10px 6px 30px;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      color: var(--text-primary);
      outline: none;
      transition: all 0.15s;
    }
    
    .search-input::placeholder {
      color: var(--text-muted);
    }
    
    .search-input:focus {
      border-color: #00ff88;
    }
    
    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 11px;
    }
    
    /* Filters Bar */
    .filters-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: var(--bg-dark);
      border-bottom: 1px solid var(--border);
    }
    
    .filter-btn {
      padding: 4px 10px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.15s;
    }
    
    .filter-btn:hover {
      border-color: var(--text-muted);
      color: var(--text-primary);
    }
    
    .filter-btn.active {
      border-color: #00ff88;
      color: #00ff88;
      background: rgba(0, 255, 136, 0.1);
    }
    
    .color-legend {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-left: auto;
      font-size: 10px;
      color: var(--text-muted);
    }
    
    .legend-gradient {
      width: 120px;
      height: 12px;
      background: linear-gradient(90deg, #ff0000, #993333, #333333, #339933, #00ff00);
      border-radius: 2px;
    }
    
    .legend-label {
      font-size: 9px;
      color: var(--text-muted);
    }
    
    /* Main Heatmap Container */
    .heatmap-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: var(--bg-dark);
    }
    
    #heatmap-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    
    /* Hover Panel - DEX Trades & LP Pools */
    .hover-panel {
      position: absolute;
      display: none;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      min-width: 320px;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      z-index: 100;
      overflow: hidden;
    }
    
    .hover-panel.visible {
      display: block;
    }
    
    .panel-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.02);
    }
    
    .panel-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: #000;
    }
    
    .panel-title {
      flex: 1;
    }
    
    .panel-title h3 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 2px;
    }
    
    .panel-title p {
      font-size: 11px;
      color: var(--text-muted);
      font-family: monospace;
    }
    
    .panel-price {
      text-align: right;
    }
    
    .panel-price .price {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
    }
    
    .panel-price .change {
      font-size: 12px;
      font-weight: 600;
    }
    
    .panel-price .change.positive { color: #00cc66; }
    .panel-price .change.negative { color: #ff4444; }
    
    /* Tabs */
    .panel-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
    }
    
    .panel-tab {
      flex: 1;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
      border-bottom: 2px solid transparent;
    }
    
    .panel-tab:hover {
      color: var(--text-secondary);
    }
    
    .panel-tab.active {
      color: #00ff88;
      border-bottom-color: #00ff88;
    }
    
    /* DEX Trades */
    .trades-list {
      max-height: 200px;
      overflow-y: auto;
    }
    
    .trade-item {
      display: flex;
      align-items: center;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
    }
    
    .trade-item:last-child {
      border-bottom: none;
    }
    
    .trade-type {
      width: 40px;
      font-weight: 600;
      text-transform: uppercase;
    }
    
    .trade-type.buy { color: #00cc66; }
    .trade-type.sell { color: #ff4444; }
    
    .trade-amount {
      flex: 1;
      color: var(--text-primary);
      font-weight: 500;
    }
    
    .trade-price {
      color: var(--text-secondary);
      margin-right: 12px;
    }
    
    .trade-time {
      color: var(--text-muted);
      font-size: 10px;
    }
    
    /* LP Pools */
    .pools-list {
      max-height: 200px;
      overflow-y: auto;
    }
    
    .pool-item {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
    }
    
    .pool-item:last-child {
      border-bottom: none;
    }
    
    .pool-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    
    .pool-pair {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
    }
    
    .pool-dex {
      font-size: 10px;
      color: var(--text-muted);
      padding: 2px 6px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
    }
    
    .pool-stats {
      display: flex;
      gap: 16px;
    }
    
    .pool-stat {
      display: flex;
      flex-direction: column;
    }
    
    .pool-stat-label {
      font-size: 9px;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    
    .pool-stat-value {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-primary);
    }
    
    /* Panel Stats Grid */
    .panel-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--border);
      border-top: 1px solid var(--border);
    }
    
    .panel-stat {
      text-align: center;
      padding: 10px 8px;
      background: var(--bg-panel);
    }
    
    .panel-stat-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    
    .panel-stat-value {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
    }
    
    /* Loading State */
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-dark);
      z-index: 1000;
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: #00ff88;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading-text {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-muted);
      margin-top: 16px;
    }
    
    /* Mobile Styles */
    @media (max-width: 768px) {
      .header {
        padding: 6px 12px;
        flex-wrap: wrap;
        gap: 8px;
      }
      
      .header-stats {
        display: none;
      }
      
      .search-input {
        width: 120px;
      }
      
      .filters-bar {
        padding: 6px 12px;
        overflow-x: auto;
      }
      
      .color-legend {
        display: none;
      }
      
      .hover-panel {
        min-width: 280px;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">
      <span class="logo-text">manamatrix.eth</span>
    </div>
    
    <div class="header-stats">
      <div class="stat">
        <span class="stat-label">24h Volume</span>
        <span class="stat-value" id="total-volume">$0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Market Cap</span>
        <span class="stat-value" id="total-mcap">$0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Gainers</span>
        <span class="stat-value positive" id="gainers-count">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Losers</span>
        <span class="stat-value negative" id="losers-count">0</span>
      </div>
    </div>
    
    <div class="header-controls">
      <div class="chain-selector">
        <button class="chain-btn active" data-chain="solana">SOL</button>
        <button class="chain-btn" data-chain="ethereum">ETH</button>
        <button class="chain-btn" data-chain="base">BASE</button>
        <button class="chain-btn" data-chain="bsc">BSC</button>
      </div>
      <div class="search-box">
        <span class="search-icon">&#128269;</span>
        <input type="text" class="search-input" placeholder="Search..." id="search-input">
      </div>
    </div>
  </header>
  
  <div class="filters-bar">
    <button class="filter-btn active" data-filter="mcap">Market Cap</button>
    <button class="filter-btn" data-filter="volume">Volume</button>
    <button class="filter-btn" data-filter="change">% Change</button>
    <button class="filter-btn" data-filter="liquidity">Liquidity</button>
    
    <div class="color-legend">
      <span class="legend-label">-50%</span>
      <div class="legend-gradient"></div>
      <span class="legend-label">+50%</span>
    </div>
  </div>
  
  <div class="heatmap-container">
    <canvas id="heatmap-canvas"></canvas>
    
    <div class="loading-overlay" id="loading">
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading tokens...</div>
    </div>
  </div>
  
  <!-- Hover Panel for DEX Trades & LP Pools -->
  <div class="hover-panel" id="hover-panel">
    <div class="panel-header">
      <div class="panel-icon" id="panel-icon">??</div>
      <div class="panel-title">
        <h3 id="panel-name">Token Name</h3>
        <p id="panel-address">0x...</p>
      </div>
      <div class="panel-price">
        <div class="price" id="panel-price">$0.00</div>
        <div class="change positive" id="panel-change">+0.00%</div>
      </div>
    </div>
    
    <div class="panel-tabs">
      <button class="panel-tab active" data-tab="trades">DEX Trades</button>
      <button class="panel-tab" data-tab="pools">LP Pools</button>
    </div>
    
    <div id="trades-content">
      <div class="trades-list" id="trades-list">
        <!-- Trades will be populated here -->
      </div>
    </div>
    
    <div id="pools-content" style="display: none;">
      <div class="pools-list" id="pools-list">
        <!-- Pools will be populated here -->
      </div>
    </div>
    
    <div class="panel-stats">
      <div class="panel-stat">
        <div class="panel-stat-label">Volume 24h</div>
        <div class="panel-stat-value" id="panel-volume">$0</div>
      </div>
      <div class="panel-stat">
        <div class="panel-stat-label">Liquidity</div>
        <div class="panel-stat-value" id="panel-liquidity">$0</div>
      </div>
      <div class="panel-stat">
        <div class="panel-stat-label">Market Cap</div>
        <div class="panel-stat-value" id="panel-mcap">$0</div>
      </div>
      <div class="panel-stat">
        <div class="panel-stat-label">Txns 24h</div>
        <div class="panel-stat-value" id="panel-txns">0</div>
      </div>
    </div>
  </div>
  
  <script type="module" src="./index.ts"></script>
</body>
</html>
